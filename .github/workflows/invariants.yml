name: invariants

on:
  push:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Full test suite (must not shrink)
        env:
          RNG_PLAYS: 3
          SHOW_PROGRESS: 0
        run: python -m unittest discover src/tests

      - name: Encoding coverage
        run: python scripts/verify_encoding_coverage.py

      - name: Test integrity (protected tests)
        run: python scripts/verify_test_integrity.py

      - name: Doc budget
        run: python scripts/verify_doc_budget.py

      - name: Cross-process determinism
        run: |
          a=$(python scripts/verify_cross_process_sampling.py)
          b=$(python scripts/verify_cross_process_sampling.py)
          if [ "$a" != "$b" ]; then echo "FAIL: 跨进程不一致"; echo "$a"; echo "$b"; exit 1; fi
          echo "PASS"
